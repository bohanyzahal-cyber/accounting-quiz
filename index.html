<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בוחן תרגול — חשבונאות פיננסית</title>
<style>
:root{
  --bg:#f7f6f3; --surface:#ffffff; --surface2:#f1efe8; --text:#1f1f1d; --muted:#6b6b66;
  --border:#e3e1da; --borderS:#cfccc2; --accent:#0f766e; --accentSoft:#e2f2ef;
  --okBg:#e6f4ea; --okBd:#9bd3ad; --okTx:#1a6b1a;
  --errBg:#fceaea; --errBd:#e6a3a3; --errTx:#b23030;
  --warnTx:#854f0b; --warnBg:#faeeda;
  --clsTx:#1d4f91; --clsBg:#e4edf9;
  --sumTx:#6b3fa0; --sumBg:#f0e9f8;
  --hardTx:#9a3412; --hardBg:#fdebdf;
  --chipBg:#efeee9; --onAccent:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not(.light){color-scheme:dark;
    --bg:#1a1a18; --surface:#242421; --surface2:#2f2f2c; --text:#ececea; --muted:#a3a39c;
    --border:#37372f; --borderS:#4a4a46; --accent:#5fd3c0; --accentSoft:#143d38;
    --okBg:#16331f; --okBd:#2f6b3f; --okTx:#7fd49a;
    --errBg:#3a1d1d; --errBd:#7a3535; --errTx:#e89393;
    --warnTx:#fac775; --warnBg:#4a2b06;
    --clsTx:#9cc0f0; --clsBg:#1c3350;
    --sumTx:#c9b3ee; --sumBg:#2e2340;
    --hardTx:#f4a97f; --hardBg:#3f2317;
    --chipBg:#2f2f2a; --onAccent:#0b1f1c;
  }
}
html.dark,:root[data-theme="dark"]:not(.light){color-scheme:dark;
  --bg:#1a1a18; --surface:#242421; --surface2:#2f2f2c; --text:#ececea; --muted:#a3a39c;
  --border:#37372f; --borderS:#4a4a46; --accent:#5fd3c0; --accentSoft:#143d38;
  --okBg:#16331f; --okBd:#2f6b3f; --okTx:#7fd49a;
  --errBg:#3a1d1d; --errBd:#7a3535; --errTx:#e89393;
  --warnTx:#fac775; --warnBg:#4a2b06;
  --clsTx:#9cc0f0; --clsBg:#1c3350;
  --sumTx:#c9b3ee; --sumBg:#2e2340;
  --hardTx:#f4a97f; --hardBg:#3f2317;
  --chipBg:#2f2f2a; --onAccent:#0b1f1c;
}
html.light{color-scheme:light;
  --bg:#f7f6f3; --surface:#ffffff; --surface2:#f1efe8; --text:#1f1f1d; --muted:#6b6b66;
  --border:#e3e1da; --borderS:#cfccc2; --accent:#0f766e; --accentSoft:#e2f2ef;
  --okBg:#e6f4ea; --okBd:#9bd3ad; --okTx:#1a6b1a;
  --errBg:#fceaea; --errBd:#e6a3a3; --errTx:#b23030;
  --warnTx:#854f0b; --warnBg:#faeeda;
  --clsTx:#1d4f91; --clsBg:#e4edf9;
  --sumTx:#6b3fa0; --sumBg:#f0e9f8;
  --hardTx:#9a3412; --hardBg:#fdebdf;
  --chipBg:#efeee9; --onAccent:#ffffff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',Arial,'Helvetica Neue',sans-serif;line-height:1.65;
  overflow-wrap:break-word;-webkit-text-size-adjust:100%;}
.wrap{max-width:820px;margin:0 auto;padding:22px 20px 60px;}
header h1{font-size:23px;margin:0 0 4px;font-weight:650;}
header .sub{color:var(--muted);font-size:13.5px;margin-bottom:16px;}
.aids{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.aid{display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  background:var(--chipBg);border:1px solid var(--border);border-radius:10px;
  padding:9px 14px;color:var(--text);font-size:13.5px;transition:.15s;flex:1 1 260px;}
.aid:hover{border-color:var(--accent);}
.aid b{font-weight:650;}
.aid i{font-style:normal;font-size:16px;line-height:1;flex:none;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.scopehint{font-size:12.5px;color:var(--muted);margin:-6px 0 12px;padding-right:2px;}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:12px;}
.chip{background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit;}
.chip:hover{border-color:var(--accent);}
.chip.active{background:var(--accent);color:var(--onAccent);border-color:var(--accent);}
.chip small{opacity:.75;font-size:11px;}
.lbl{font-size:12px;color:var(--muted);margin-left:4px;align-self:center;min-width:44px;}
.spacer{flex:1;}
.iconbtn{background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;}
.iconbtn:hover{border-color:var(--accent);}
a.iconbtn{text-decoration:none;display:inline-block;}
/* חלון אישור בתוך הדף (confirm() חסום בתצוגות מוטמעות) */
.cfm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:50;}
.cfm-box{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:14px;
  padding:20px;width:100%;max-width:380px;box-shadow:0 12px 32px rgba(0,0,0,.28);}
.cfm-msg{font-size:15.5px;margin-bottom:16px;}
.cfm-row{display:flex;gap:10px;}
/* קישורי PDF להדפסה באתר המפורסם */
.prpdf{margin-top:14px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
.prpdf summary{cursor:pointer;font-weight:600;font-size:14px;}
.prrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px;}
.prl{flex:1 1 210px;min-width:0;font-size:13.5px;}
.prpdf .scopehint{margin:10px 0 0;}
.note{background:var(--accentSoft);border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;font-size:13px;margin-bottom:14px;}
.note b{color:var(--accent);}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;margin-bottom:12px;color:var(--muted);}
.stats b{color:var(--text);}
.bar{height:7px;background:var(--chipBg);border-radius:999px;overflow:hidden;margin-bottom:18px;}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s;}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);}
.qtext{font-size:17.5px;font-weight:600;margin-bottom:15px;line-height:1.6;}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--borderS);
  border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:.12s;
  background:var(--surface);width:100%;text-align:right;font:inherit;color:var(--text);}
.opt:hover{border-color:var(--accent);background:var(--accentSoft);}
.opt .ltr{font-weight:700;color:var(--accent);min-width:19px;}
.opt.correct{background:var(--okBg);border-color:var(--okBd);}
.opt.correct .ltr{color:var(--okTx);}
.opt.wrong{background:var(--errBg);border-color:var(--errBd);}
.opt.wrong .ltr{color:var(--errTx);}
.opt.locked{cursor:default;}
.opt.locked:hover{background:var(--surface);border-color:var(--borderS);}
.opt.correct.locked:hover{background:var(--okBg);border-color:var(--okBd);}
.opt.wrong.locked:hover{background:var(--errBg);border-color:var(--errBd);}
/* במצב מבחן אין משוב עד ההגשה — הבחירה מסומנת בצבע נייטרלי. ירוק אומר "נכון". */
.opt.picked{background:var(--accentSoft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
.opt.picked .ltr{color:var(--accent);}
.opt.picked:hover{background:var(--accentSoft);border-color:var(--accent);}
.opt.picked .ltr::after{content:" ✓";font-size:12px;}
.expl{margin-top:8px;padding:13px 15px;border-radius:10px;background:var(--accentSoft);
  border:1px solid var(--border);font-size:14px;}
.expl .tag{font-weight:700;color:var(--accent);}
.nav{display:flex;gap:10px;margin-top:16px;}
.btn{flex:1;background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:12px;font-size:15px;cursor:pointer;font-family:inherit;}
.btn:hover{border-color:var(--accent);}
.btn-pri{background:var(--accent);color:var(--onAccent);border-color:var(--accent);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;max-height:190px;overflow-y:auto;}
.pbtn{width:33px;height:33px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);font-size:12.5px;cursor:pointer;font-family:inherit;}
.pbtn.cur{outline:2px solid var(--accent);outline-offset:1px;}
.pbtn.ok{background:var(--okBg);border-color:var(--okBd);color:var(--okTx);}
.pbtn.bad{background:var(--errBg);border-color:var(--errBd);color:var(--errTx);}
.pbtn.ans{background:var(--accentSoft);border-color:var(--accent);color:var(--accent);}
.ptitle{font-size:12.5px;color:var(--muted);margin-bottom:7px;}
.result{text-align:center;}
.result .big{font-size:46px;font-weight:800;color:var(--accent);line-height:1.1;}
.result .grade{font-size:17px;margin:8px 0 16px;}
.clock{font-variant-numeric:tabular-nums;font-weight:650;}
.rev{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--surface2);font-size:14px;text-align:right;}
.rev .rq{font-weight:600;margin-bottom:6px;}
.rev .ra{color:var(--errTx);}
.rev .rc{color:var(--okTx);}
/* המילה שמכריעה בין התשובות, בהסברים של השאלות הקשות */
mark.key{background:var(--warnBg);color:inherit;padding:0 3px;border-radius:4px;font-weight:650;}
/* חישובים מוצגים משמאל לימין, בסדר שבו נכתבו */
bdi.m{direction:ltr;unicode-bidi:isolate;}
.ctitle{font-size:16px;font-weight:650;margin:0 0 6px;}
.brk{display:flex;align-items:center;gap:10px;font-size:13.5px;margin-bottom:7px;}
.brk .bl{flex:0 0 210px;}
.brk .bb{flex:1;height:8px;background:var(--chipBg);border-radius:999px;overflow:hidden;}
.brk .bb>i{display:block;height:100%;background:var(--okTx);}
.brk.mid .bb>i{background:var(--warnTx);}
.brk.low .bb>i{background:var(--errTx);}
.brk .bv{flex:0 0 44px;text-align:left;font-variant-numeric:tabular-nums;color:var(--muted);}
@media (max-width:540px){
  .wrap{padding:16px 14px 48px;} .card{padding:16px;} .qtext{font-size:16px;}
  header h1{font-size:19px;} .pbtn{width:29px;height:29px;font-size:11.5px;}
  .opt{padding:11px 12px;} .stats{gap:11px;font-size:13px;}
  .brk .bl{flex-basis:130px;font-size:12.5px;}
}

/* ---------- תצוגת הדפסה של השאלות ---------- */
#print{display:none;}
.pq{break-inside:avoid;margin-bottom:9px;}
.pq .pn{font-weight:700;color:var(--accent);}
.pq .po{margin:1px 0 0 0;padding-right:15px;}
.pq .pa{color:var(--okTx);font-weight:600;}
.pq .pe{color:var(--muted);}
.prhead{display:none;}
@media print{
  @page{size:A4;margin:11mm 10mm;}
  html,body{background:#fff!important;color:#000!important;}
  html{--accent:#0f5a54;--muted:#444;--okTx:#0a5c22;--border:#bbb;}
  .wrap{max-width:none;padding:0;}
  header,#app,.foot{display:none!important;}
  #print{display:block!important;font-size:9.6pt;line-height:1.34;}
  #print.cols{column-count:2;column-gap:8mm;column-rule:1px solid #ccc;}
  .prhead{display:block;border-bottom:1.5px solid #000;padding-bottom:2mm;
    margin-bottom:3mm;column-span:all;}
  .prhead h2{font-size:13pt;margin:0;}
  .prhead div{font-size:8.6pt;color:#444;margin-top:1mm;}
  .pq{margin-bottom:2.6mm;}
  .pq .pt{font-size:7.6pt;color:#666;}
  .pq .pe{font-size:8.8pt;}
  /* שאלות, ואחריהן מפתח תשובות והסברים בעמוד נפרד */
  .pcols,.pkey{column-count:2;column-gap:8mm;column-rule:1px solid #ccc;}
  .pkey{break-before:page;page-break-before:always;}
  .pkey h3{column-span:all;font-size:12pt;margin:0 0 3mm;padding-bottom:2mm;border-bottom:1.5px solid #000;}
  .pk{break-inside:avoid;margin-bottom:2.2mm;font-size:8.8pt;}
  .pk b{color:var(--accent);}
  .pk .pe{color:var(--muted);}
}
</style>

<body>
<div class="wrap">
<header>
  <h1>בוחן תרגול — חשבונאות פיננסית</h1>
  <div class="sub" id="sub"></div>
  <div class="aids">
    <a class="aid" href="דף-עזר-חשבונאות.pdf" target="_blank"><i>📄</i><span><b>דף העזר למבחן</b> — עמוד אחד בצד אחד, PDF להדפסה</span></a>
    <a class="aid" href="דף-עזר-חשבונאות.html" target="_blank"><i>🖥</i><span><b>דף העזר כדף אינטרנט</b> — אותו תוכן, נוח לקריאה במסך</span></a>
  </div>
</header>
<div id="app"></div>
<div id="print"></div>
<div class="foot" style="text-align:center;color:var(--muted);font-size:12px;margin-top:24px;">
  לתרגול לימודי בלבד · נבנה מהמצגות, מהסיכומים ומקובץ התרגילים של הקורס
</div>
</div>
<script>
var BANK=[];
/* פרק 1 — מבוא, הנחות יסוד ועקרונות (מצגת 1, סיכום מבנה הדוחות, דף העזר הקיים).
   מבנה: l פרק · t נושא · s מקור · k סוג · q שאלה · o תשובות (הנכונה ראשונה) · e הסבר. ⟦מילה⟧ = המילה שמכריעה. */
BANK.push(
{l:1,t:"מטרות ומשתמשים",s:"מצגת",k:"עיוני",
 q:"מהי חשבונאות לפי ההגדרה בקורס?",
 o:["שפה עסקית מקובלת, שמתארת עסקאות, נכסים והתחייבויות, מודדת רווח ומייצרת את הדוחות הכספיים לקבלת החלטות",
    "מערכת לחישוב חבות המס של החברה בלבד",
    "תחזית של רווחי החברה בשנים הבאות",
    "רישום של תנועות המזומנים בחשבון הבנק בלבד"],
 e:"במצגת: חשבונאות היא ⟦שפה עסקית מקובלת⟧. היא מתארת עסקאות, ערכי נכסים והתחייבויות, מודדת רווח ומייצרת את הדוחות הכספיים שעליהם מתבססות החלטות. מס, תחזיות ומזומן הם רק חלק ממה שהיא מכסה."},

{l:1,t:"מטרות ומשתמשים",s:"מצגת",k:"עיוני",
 q:"בנק השוקל לתת לחברה הלוואה יבחן את הדוחות בעיקר כדי לבדוק:",
 o:["את יכולת הפירעון של החברה, את החוסן שלה ואת ערך הנכסים שישמשו בטחונות",
    "את גובה הבונוסים שיקבלו העובדים",
    "את נתוני השוק לצורך ריגול תעשייתי",
    "את עמידת החברה בתנאי הקלות במס"],
 e:"לפי המצגת, בנקים ומוסדות מממנים בודקים ⟦יכולת פירעון⟧ (תזרים, רווחים), חוסן, ערך הנכסים כבטחונות וכריות ביטחון (הון עצמי, קובננטים). בונוסים מעניינים עובדים, ריגול תעשייתי — מתחרים, הקלות מס — רשויות המדינה."},

{l:1,t:"מטרות ומשתמשים",s:"מצגת",k:"עיוני",
 q:"איזה משתמש בדוחות הכספיים מתעניין בהם בעיקר לצורך בנצ'מרק — השוואת ביצועים?",
 o:["מתחרים","בעלי מניות קיימים","רשויות המס","עובדי החברה"],
 e:"במצגת, ⟦מתחרים⟧ משתמשים בדוחות לריגול תעשייתי ולבנצ'מרק. בעלי מניות מתעניינים בתשואה ובדיבידנד, רשויות בגביית מסים ובסטטיסטיקה, עובדים בבונוסים."},

{l:1,t:"מטרות ומשתמשים",s:"מצגת",k:"עיוני",
 q:"ספק השוקל למכור לחברה סחורה באשראי יבחן בדוחות בעיקר:",
 o:["את יכולת הפירעון של החברה ואת כדאיות מתן האשראי",
    "את ערך הנכסים שהחברה מחזיקה בחו\"ל בלבד",
    "את התחזיות של מנהל השיווק",
    "את שיעור הדיבידנד שחולק"],
 e:"ספקים בודקים ⟦יכולת פירעון⟧ (תזרים ורווחים) ו⟦כדאיות מתן אשראי⟧ — האם החברה תשלם על הסחורה."},

{l:1,t:"הנחות יסוד",s:"מצגת",k:"עיוני",
 q:"מהן ארבע הנחות היסוד של הדיווח הכספי?",
 o:["ישות כלכלית נפרדת, יחידה מוניטרית, תקופה חשבונאית, עסק חי",
    "רלוונטיות, מהימנות, השוואתיות, מובנות",
    "עלות היסטורית, הקבלה, הכרה בהכנסה, גילוי נאות",
    "מהותיות, שמרנות, עלות מול תועלת, ייחודיות"],
 e:"ארבע ⟦הנחות היסוד⟧: ישות נפרדת, יחידה מוניטרית, תקופה חשבונאית ועסק חי. רלוונטיות ומהימנות הן מאפיינים איכותיים; עלות והקבלה הן עקרונות; מהותיות ושמרנות הן אילוצים."},

{l:1,t:"הנחות יסוד",s:"סיכום",k:"עיוני",
 q:"בעל השליטה שילם מחשבון הבנק של החברה על חופשה משפחתית פרטית. לפי איזו הנחה ההוצאה לא תיכלל בהוצאות החברה?",
 o:["הנחת הישות הכלכלית הנפרדת","הנחת העסק החי","הנחת התקופה החשבונאית","עיקרון ההכרה בהכנסה"],
 e:"בעלי החברה הם ⟦יחידה כלכלית נפרדת⟧ מהעסק. הוצאה פרטית של הבעלים אינה הוצאה של העסק, גם אם שולמה מחשבון העסק."},

{l:1,t:"הנחות יסוד",s:"סיכום",k:"עיוני",
 q:"מדוע מוניטין שהחברה בנתה בעצמה ושביעות הרצון של העובדים אינם מופיעים במאזן?",
 o:["לפי הנחת היחידה המוניטרית — מה שאי אפשר למדוד בכסף לא נכנס לדוחות",
    "לפי עיקרון ההקבלה",
    "לפי הנחת העסק החי",
    "כי הם שייכים לבעלי המניות ולא לחברה"],
 e:"הנחת ⟦היחידה המוניטרית⟧: רק מה שניתן למדוד כמותית בכסף, במטבע אחיד, נכנס לדוחות. מוניטין עצמי ושביעות רצון אינם ניתנים למדידה כזו. (מוניטין שנרכש מחברה אחרת כן נרשם, כי שולם עליו סכום.)"},

{l:1,t:"הנחות יסוד",s:"מצגת",k:"עיוני",
 q:"מהי הנחת \"העסק החי\"?",
 o:["אין אינדיקציה שהחברה לא תוכל להמשיך לפעול בעתיד הנראה לעין, ולכן נכסיה מוצגים לפי עלות ולא לפי ערך פירוק",
    "החברה חייבת להיות רווחית בכל שנה",
    "החברה מדווחת בפרקי זמן קבועים ואחידים",
    "החברה נפרדת מבעליה"],
 e:"⟦עסק חי⟧ = מניחים שהחברה תמשיך לפעול, ולכן הנכסים מוצגים לפי עלותם ולא לפי מה שיתקבל במכירה בכפייה. כשההנחה לא מתקיימת (קריסה קרובה), מציגים לפי שווי מימוש."},

{l:1,t:"הנחות יסוד",s:"מצגת",k:"עיוני",
 q:"חברה מפרסמת דוחות שנתיים ורבעוניים בפרקי זמן קבועים. איזו הנחת יסוד באה כאן לידי ביטוי?",
 o:["התקופה החשבונאית","העסק החי","היחידה המוניטרית","הישות הנפרדת"],
 e:"הנחת ⟦התקופה החשבונאית⟧: הדיווח נעשה בתקופות זמן קצובות ואחידות, כדי שאפשר יהיה למדוד ביצועים ולהשוות בין תקופות."},

{l:1,t:"שאלות לדוגמה מהמצגת",s:"מצגת",k:"חישוב",
 q:"מכונות החברה מוצגות לפי עלות היסטורית של 300 מיליון דולר. שמאי העריך שבקריסה אפשר לממש אותן ב-50 מיליון לכל היותר, ושתידרש הוצאה של 4 מיליון לשמאים, לעורכי דין ולמתווכים. הדירקטוריון השתכנע שהחברה תקרוס. כיצד יוצגו המכונות?",
 o:["46 מיליון, ויירשם הפסד של 254 מיליון בדוח רווח והפסד",
    "50 מיליון, ויירשם הפסד של 250 מיליון",
    "300 מיליון, ללא השפעה על הרווח",
    "46 מיליון, וההפרש יירשם ישירות בהון בלי לעבור ברווח והפסד"],
 e:"כשהנחת ⟦העסק החי⟧ לא מתקיימת, מציגים לפי שווי מימוש נטו: 50 − 4 = 46 מיליון. הירידה, 300 − 46 = 254 מיליון, נרשמת כהפסד בדוח רווח והפסד (גם לפי השמרנות)."},

{l:1,t:"שאלות לדוגמה מהמצגת",s:"מצגת",k:"עיוני",
 q:"מכונות החברה מוצגות לפי עלות היסטורית של 300 מיליון דולר. שמאי העריך שבקריסה אפשר יהיה לממש אותן ב-46 מיליון נטו. הדירקטוריון אימץ דווקא את הגישה האופטימית של מנהל השיווק, שלפיה מבצעי הפרסום בסין ובהודו יניבו רווחים גדולים, והחברה ממשיכה לפעול. כיצד יוצגו המכונות?",
 o:["לפי העלות ההיסטורית, 300 מיליון — לא מגדילים את הערך בגלל רווחים צפויים",
    "לפי הערכה של הרווחים העתידיים מהפרסום",
    "לפי 46 מיליון בכל מקרה",
    "לפי מחיר השוק הגבוה ביותר שנמצא"],
 e:"בעסק חי הנכס נשאר לפי ⟦עלות היסטורית⟧. רווחים צפויים לא נרשמים לפני שמומשו (שמרנות): מכירים בהפסד צפוי, אבל לא ברווח צפוי."},

{l:1,t:"שאלות לדוגמה מהמצגת",s:"מצגת",k:"חישוב",
 q:"ב-1.1.2020 שכרה פירמה מכונת דפוס ושילמה מראש 36 אלף ₪ לשלוש שנים (12 אלף לכל שנה). בשנים 2020, 2021 ו-2022 נתנה שירותים ב-16, 9 ו-20 אלף ₪. מהו הרווח הישיר בכל שנה?",
 o:["4 אלף, הפסד 3 אלף, 8 אלף",
    "הפסד 20 אלף, 9 אלף, 20 אלף",
    "4 אלף, 4 אלף, 4 אלף",
    "16 אלף, 9 אלף, 20 אלף"],
 e:"לפי ⟦עיקרון ההקבלה⟧ מייחסים לכל שנה את 12 אלף השכירות שלה, ולא את כל 36 אלף בשנת התשלום. לפי ⟦ההכרה בהכנסה⟧ ההכנסה נרשמת בשנה שבה ניתן השירות: 16 − 12 = 4 · 9 − 12 = −3 · 20 − 12 = 8."},

{l:1,t:"שאלות לדוגמה מהמצגת",s:"מצגת",k:"חישוב",
 q:"שני קבלנים בונים בניינים זהים: עלות 20 מיליון, תמורה צפויה 25 מיליון במכירת הדירות ב-31.12.2017. ב-31.12.2016 קבלן ב' מגלה שבשל מצב השוק יקבל לכל היותר 17 מיליון. מה יציג קבלן ב' בדוח רווח והפסד לשנת 2016?",
 o:["הפסד של 3 מיליון, כבר ב-2016",
    "אפס — ההפסד יירשם רק במכירה ב-2017",
    "רווח של 5 מיליון לפי התוכנית העסקית",
    "הפסד של 8 מיליון"],
 e:"לפי ⟦השמרנות⟧ מכירים בהפסד צפוי מיד, בתקופה שבה התברר: 17 − 20 = הפסד של 3 מיליון ב-2016. ב-2017, במכירה, לא יירשם הפסד נוסף."},

{l:1,t:"שאלות לדוגמה מהמצגת",s:"מצגת",k:"עיוני",
 q:"קבלן בונה בניין בעלות 20 מיליון, ותכנן למכור את הדירות ב-31.12.2017 ב-25 מיליון. ב-31.12.2016 הוא מגלה שיקבל רק 22 מיליון. מה יציג בדוח רווח והפסד לשנת 2016?",
 o:["אפס — הרווח של 2 מיליון יוכר רק במכירה ב-2017",
    "רווח של 2 מיליון כבר ב-2016",
    "הפסד של 3 מיליון ב-2016",
    "רווח של 5 מיליון ב-2016"],
 e:"הקבלן עדיין ברווח (22 > 20). רווח צפוי ⟦לא מוכר לפני המימוש⟧ (הכרה בהכנסה ושמרנות), ולכן ב-2016 אין רווח, וב-2017 יוצג רווח של 2 מיליון."},

{l:1,t:"מאפיינים איכותיים",s:"רשימה",k:"עיוני",
 q:"לאיזה מאפיין איכותי של המידע קשור מועד פרסום הדוחות הכספיים (למשל: דוח שנתי עד 90 יום מתום השנה, דוח רבעוני עד 45 יום)?",
 o:["רלוונטיות — זמינות המידע במועד","השוואתיות","מובנות","ניטרליות"],
 e:"⟦רלוונטיות⟧ כוללת זמינות במועד: מידע שמגיע מאוחר מאבד מהשימושיות שלו. קיצור הזמן מגביר את הרלוונטיות, אבל עלול לפגוע במהימנות (פחות זמן לבדיקה)."},

{l:1,t:"מאפיינים איכותיים",s:"מצגת",k:"עיוני",
 q:"רשות ניירות ערך מקצרת את המועד לפרסום הדוחות השנתיים מ-90 ל-30 יום. מה ההשפעה הצפויה על איכות המידע?",
 o:["הרלוונטיות עולה, אבל המהימנות עלולה לרדת",
    "המהימנות עולה והרלוונטיות יורדת",
    "אין השפעה על איכות המידע",
    "גם הרלוונטיות וגם המהימנות יורדות"],
 e:"זו ⟦התנגשות בין רלוונטיות למהימנות⟧: מידע מהיר יותר שימושי יותר, אבל יש פחות זמן לאסוף ולבקר אותו."},

{l:1,t:"מאפיינים איכותיים",s:"מצגת",k:"עיוני",
 q:"מה ההבדל העיקרי בין תחזית רווח שמפרסמים מנהלי החברה לבין תחזית מזג אוויר של מטאורולוג?",
 o:["למנהלים יש אינטרס בתוצאה, ולכן התחזית שלהם עלולה להיות לא ניטרלית ופחות מהימנה",
    "תחזית המנהלים תמיד מדויקת יותר",
    "תחזית המטאורולוג מבוססת על עלות היסטורית",
    "אין הבדל — שתיהן ניטרליות"],
 e:"⟦ניטרליות⟧ = מידע ללא הטיה וללא ניגוד עניינים. למטאורולוג אין אינטרס במזג האוויר; למנהל יש (תגמול, מחיר המניה), ולכן התחזית שלו עלולה להיות מוטה ופחות ⟦מהימנה⟧."},

{l:1,t:"מאפיינים איכותיים",s:"מצגת",k:"עיוני",
 q:"חברה חכרה מנוף ל-10 שנים — כל אורך חייו (בסוף התקופה שוויו אפס). דמי חכירה של 50 אלף ₪ ישולמו בתחילת כל שנה. כיצד יש להציג את העסקה?",
 o:["כרכישת מנוף באשראי לזמן ארוך: נכס במאזן ומולו התחייבות",
    "כהוצאת שכירות של 50 אלף בכל שנה בלבד, כי משפטית זו שכירות",
    "לא להציג כלל עד סוף התקופה",
    "כהכנסה של 500 אלף"],
 e:"לפי ⟦העדפת התוכן על פני הצורה⟧ מה שקובע הוא המהות הכלכלית: החברה משתמשת במנוף לכל חייו, כלומר בפועל רכשה אותו במימון לזמן ארוך. לכן הוא נרשם כנכס, ומולו התחייבות."},

{l:1,t:"מאפיינים איכותיים",s:"מצגת",k:"עיוני",
 q:"חברה מכרה את הבניין שלה לבנק, ובאותו יום חכרה אותו בחזרה לטווח ארוך והמשיכה להשתמש בו. איזה עיקרון מחייב לבחון את העסקה לפי מהותה ולא לפי החוזה?",
 o:["העדפת התוכן על פני הצורה","עלות מול תועלת","התקופה החשבונאית","היחידה המוניטרית"],
 e:"במצגת, מכירה וחכירה חוזרת היא הדוגמה ל⟦תוכן על פני צורה⟧ (חלק מהמהימנות): אם המהות לא השתנתה — החברה עדיין משתמשת בבניין — לא משנים את הרישום רק בגלל צורת החוזה."},

{l:1,t:"אילוצים",s:"רשימה",k:"עיוני",
 q:"חברה רכשה מחשבון כיס ב-30 ₪, והיא צפויה להשתמש בו כמה שנים. היא רשמה את כל הסכום כהוצאה מיד. על איזה עיקרון היא נשענת?",
 o:["מהותיות","עלות היסטורית","הקבלה","שמרנות"],
 e:"תאורטית המחשבון הוא רכוש קבוע שצריך להפחית, אבל הסכום ⟦לא מהותי⟧: הוא לא ישפיע על החלטות המשתמשים, ומעקב פחת עליו לא שווה את העלות. לכן רושמים אותו מיד כהוצאה."},

{l:1,t:"אילוצים",s:"רשימה",k:"עיוני",
 q:"כיצד מיושם עיקרון השמרנות בחשבונאות?",
 o:["מלאי מוצג לפי הנמוך מבין העלות ושווי המימוש נטו: הפסד צפוי נרשם מיד, ורווח צפוי רק במימוש",
    "נכסים מוצגים תמיד לפי מחיר השוק הגבוה ביותר",
    "הכנסות נרשמות כבר בחתימה על הזמנה",
    "כל ההוצאות נדחות לשנה הבאה"],
 e:"⟦שמרנות (זהירות)⟧: כשיש ספק, מעדיפים להציג נכסים ורווח נמוכים יותר. הדוגמה המרכזית: מלאי לפי הנמוך מבין העלות ושווי המימוש נטו, והכרה מיידית בהפסד מירידת ערך."},

{l:1,t:"עקרונות",s:"רשימה",k:"עיוני",
 q:"עובדי החברה עבדו בדצמבר והפיקו את ההכנסות של אותו חודש, אבל השכר שלהם ישולם רק בינואר. מתי תירשם הוצאת השכר?",
 o:["בדצמבר, יחד עם ההכנסות שהשכר יצר — עיקרון ההקבלה",
    "בינואר, כשהכסף יוצא מהבנק",
    "לא תירשם, כי זו רק התחייבות",
    "חצי בדצמבר וחצי בינואר"],
 e:"⟦עיקרון ההקבלה⟧: הוצאות נרשמות באותה תקופה שבה נרשמו ההכנסות שהן עזרו לייצר, בלי קשר למועד התשלום. בדצמבר: הוצאת שכר, ומולה התחייבות לעובדים שתיסגר בתשלום בינואר."},

{l:1,t:"עקרונות",s:"סיכום",k:"עיוני",
 q:"חברה סיפקה ללקוח שירות בדצמבר, והלקוח ישלם בפברואר. מתי תוכר ההכנסה?",
 o:["בדצמבר, כשהשירות ניתן","בפברואר, כשהכסף יתקבל","רק כשהחשבונית תשולם במלואה","בתחילת השנה הבאה"],
 e:"⟦עיקרון ההכרה בהכנסה⟧: ההכנסה נרשמת כשהסחורה סופקה או השירות ניתן, בלי קשר לקבלת הכסף. בדצמבר נרשמת הכנסה, ומולה לקוחות (חוב של הלקוח)."},

{l:1,t:"עקרונות",s:"מצגת",k:"עיוני",
 q:"חברה קנתה קרקע לפני 10 שנים ב-1 מיליון ₪. היום שוויה 4 מיליון. לפי מה תוצג במאזן (במודל העלות)?",
 o:["1 מיליון — עלות היסטורית","4 מיליון — שווי שוק","2.5 מיליון — ממוצע","3 מיליון — העלייה בערך"],
 e:"⟦עקרון העלות ההיסטורית⟧ (אובייקטיביות): הנכס מוצג לפי מה ששולם עליו — נתון שאפשר לבדוק. שווי השוק רלוונטי יותר אבל פחות מהימן. (מודל הערכה מחדש הוא חלופה, ואז העלייה נזקפת להון.)"},

{l:1,t:"עקרונות",s:"מצגת",k:"עיוני",
 q:"איזה מהבאים אינו גישה חלופית לעלות ההיסטורית במדידה?",
 o:["עלות מותאמת למס","שווי הוגן (ערך מימוש)","עלות שוטפת (שחלוף)","ערך נוכחי"],
 e:"במצגת, הגישות החלופיות לעלות הן ⟦שווי הוגן⟧, ⟦עלות שוטפת (שחלוף)⟧ ו⟦ערך נוכחי⟧. אין גישה בשם 'עלות מותאמת למס'."},

{l:1,t:"מאפיינים איכותיים",s:"מצגת",k:"עיוני",
 q:"מה מדגימה ההתלבטות בין הצגת נדל\"ן לפי שווי השוק העדכני לבין הצגתו לפי עלות?",
 o:["התנגשות בין רלוונטיות למהימנות","התנגשות בין מהותיות לשמרנות","עלות מול תועלת","היחידה המוניטרית"],
 e:"במצגת: ⟦התנגשות בין מאפיינים איכותיים⟧ — רלוונטיות מול מהימנות, עם הדוגמה של ערך נדל\"ן. שווי השוק רלוונטי יותר להחלטות; העלות מהימנה יותר כי היא עובדה."},

{l:1,t:"מאפיינים איכותיים",s:"סיכום",k:"עיוני",
 q:"חברה עברה השנה משיטת FIFO לממוצע משוקלל ולא דיווחה על כך. איזה מאפיין של המידע נפגע בעיקר?",
 o:["השוואתיות ועקביות","היחידה המוניטרית","הישות הנפרדת","עלות מול תועלת"],
 e:"⟦עקביות⟧ = אותה שיטה בכל שנה, כדי שאפשר יהיה ⟦להשוות⟧ בין שנים ובין חברות. החלפת שיטה מחייבת גילוי ותיקון של מספרי ההשוואה."},

{l:1,t:"מאפיינים איכותיים",s:"מצגת",k:"עיוני",

{l:2,t:"מבנה המאזן",s:"סיכום",k:"עיוני",
 q:"כיצד מוצגת ההפרשה לחובות מסופקים?",
 o:["בניכוי מסעיף הלקוחות, כי היא מקטינה את הנכס","בהתחייבויות השוטפות","בהון העצמי","כהכנסה בדוח רווח והפסד"],
 e:"חלק מהלקוחות לא ישלמו. ההפרשה לחובות מסופקים היא ⟦נכס שלילי⟧ שמוצג בניכוי מהלקוחות (כמו פחת נצבר מול רכוש קבוע). ההוצאה בגינה נרשמת בהנהלה וכלליות."},

{l:2,t:"מבנה המאזן",s:"סיכום",k:"עיוני",
 q:"היכן מוצג הפחת הנצבר במאזן?",
 o:["בצד הנכסים, בניכוי מעלות הרכוש הקבוע","בצד ההתחייבויות, כהתחייבות לא שוטפת","בהון העצמי","הוא מוצג רק בדוח רווח והפסד"],
 e:"⟦פחת נצבר⟧ הוא נכס שלילי שמקטין את הרכוש הקבוע: עלות − פחת נצבר = רכוש קבוע נטו. בדוח רווח והפסד מופיעה רק הוצאת הפחת של השנה."},

{l:2,t:"מבנה המאזן",s:"מצגת",k:"עיוני",
 q:"פטנט, זיכיון ומוניטין שנרכש מחברה אחרת יסווגו כ:",
 o:["רכוש אחר — נכסים בלתי מוחשיים, לא שוטפים","רכוש קבוע","נכסים שוטפים","הון עצמי"],
 e:"⟦רכוש אחר⟧ = נכסים לא שוטפים שאינם מוחשיים: פטנט, זכויות יוצרים, זיכיון, מוניטין שנרכש. רכוש קבוע כולל רק נכסים מוחשיים."},

{l:2,t:"מבנה המאזן",s:"סיכום",k:"עיוני",
 q:"יתרת העו\"ש של החברה בבנק שלילית (משיכת יתר). היכן תוצג?",
 o:["בהתחייבויות השוטפות","בנכסים השוטפים, בסימן מינוס","בהתחייבויות הלא שוטפות","בהון העצמי"],
 e:"כשיתרת המזומנים שלילית, הסעיף ⟦עובר לצד ההתחייבויות⟧ ונקרא משיכת יתר — התחייבות שוטפת."},

{l:2,t:"מבנה המאזן",s:"מצגת",k:"עיוני",
 q:"מהי \"פרמיה\" בהון העצמי?",
 o:["הסכום ששולם על המניות מעבר לערכן הנקוב","הרווחים שנצברו ולא חולקו","הדיבידנד שהוכרז","ריבית שהחברה מקבלת"],
 e:"בהון העצמי: ⟦הון מניות⟧ — ההשקעה בערך הנקוב; ⟦פרמיה⟧ — מה ששולם מעבר לערך הנקוב; ⟦עודפים⟧ — רווחים שנצברו וטרם חולקו."},

{l:2,t:"השפעת עסקאות",s:"רשימה",k:"עיוני",
 q:"חברה קיבלה מלקוח מקדמה במזומן של 40,000 ₪ על סחורה שתסופק בשנה הבאה. מה ההשפעה על הדוחות השנה?",
 o:["המזומן גדל ב-40,000 ומולו התחייבות (מקדמות מלקוחות); אין השפעה על דוח רווח והפסד",
    "המזומן גדל ב-40,000 וההכנסות גדלו ב-40,000",
    "אין השפעה על שום דוח עד שהסחורה תסופק",
    "ההון העצמי גדל ב-40,000"],
 e:"⟦מקדמה אינה הכנסה⟧: הסחורה עוד לא סופקה, ולכן החברה חייבת ללקוח סחורה או כסף. נכס (מזומן) ↑ והתחייבות (מקדמות) ↑. ההכנסה תוכר כשהסחורה תסופק."},

{l:2,t:"השפעת עסקאות",s:"רשימה",k:"חישוב",
 q:"השנה סיפקה חברה סחורות ושירותים בסכום כולל של 300,000 ₪. עד סוף השנה גבתה מהלקוחות 120,000 ₪ (לא היו לה חובות לקוחות מהשנה הקודמת). מהן ההכנסות בדוח רווח והפסד?",
 o:["300,000","120,000","180,000","420,000"],
 e:"⟦הכרה בהכנסה⟧: ההכנסה נרשמת כשהסחורה סופקה או השירות ניתן, בלי קשר לגבייה. ההכנסות = 300,000. ביתרת הלקוחות במאזן יישאר 300,000 − 120,000 = 180,000."},

{l:2,t:"השפעת עסקאות",s:"סיכום",k:"חישוב",
 q:"חברה חדשה מכרה השנה סחורה ב-80,000 ₪ באשראי וגבתה מהלקוחות 50,000 ₪. מה נכון?",
 o:["ההכנסות 80,000; המזומן גדל ב-50,000; יתרת הלקוחות 30,000",
    "ההכנסות 50,000; המזומן גדל ב-50,000; יתרת הלקוחות 30,000",
    "ההכנסות 80,000; המזומן גדל ב-80,000; יתרת הלקוחות 0",
    "ההכנסות 30,000; המזומן גדל ב-50,000; יתרת הלקוחות 80,000"],
 e:"ההכנסה לפי ⟦המכירה⟧: 80,000. המזומן לפי ⟦הגבייה⟧: 50,000. מה שעוד לא נגבה נשאר בלקוחות: 30,000."},

{l:2,t:"השפעת עסקאות",s:"מצגת",k:"עיוני",
 q:"חברה מכרה סחורה באשראי ברווח. מה ההשפעה על משוואת המאזן?",
 o:["הנכסים גדלים (הלקוחות גדלים יותר משהמלאי קטן) וההון העצמי גדל ברווח",
    "הנכסים וההתחייבויות גדלים באותו סכום",
    "הנכסים קטנים וההון קטן",
    "אין השפעה עד הגבייה"],
 e:"במכירה: ⟦לקוחות ↑⟧ בסכום המכירה ו⟦מלאי ↓⟧ בעלות הסחורה. ההפרש — הרווח הגולמי — מגדיל את העודפים בהון."},

{l:2,t:"השפעת עסקאות",s:"מצגת",k:"עיוני",
 q:"רכישת מלאי באשראי מספקים:",
 o:["מגדילה את הנכסים ומגדילה את ההתחייבויות","מגדילה את הנכסים ומקטינה את ההון","מקטינה את המזומן ומגדילה את המלאי","מגדילה את ההוצאות"],
 e:"מלאי ↑ (נכס), ספקים ↑ (התחייבות). אין השפעה על הרווח — המלאי יהפוך להוצאה (עלות המכר) רק כשיימכר."},

{l:2,t:"השפעת עסקאות",s:"מצגת",k:"עיוני",
 q:"תשלום במזומן לספק על חוב קודם:",
 o:["מקטין נכסים (מזומן) ומקטין התחייבויות (ספקים), בלי השפעה על הרווח",
    "מקטין את המזומן ומקטין את ההון",
    "מגדיל את ההוצאות",
    "מקטין את המזומן ומגדיל את המלאי"],
 e:"סילוק חוב: ⟦מזומן ↓ וספקים ↓⟧ באותו סכום. ההוצאה, אם יש, נרשמת רק כשהסחורה שנקנתה נמכרת."},

{l:2,t:"השפעת עסקאות",s:"מצגת",k:"עיוני",
 q:"חלוקת דיבידנד במזומן לבעלי המניות:",
 o:["מקטינה את המזומן ואת העודפים, ואינה הוצאה בדוח רווח והפסד",
    "היא הוצאה בדוח רווח והפסד",
    "מקטינה את ההתחייבויות",
    "מגדילה את ההון העצמי"],
 e:"⟦דיבידנד הוא חלוקת רווח⟧, לא הוצאה לייצור הכנסה. הוא מקטין את העודפים בדוח על השינויים בהון: עודפי סגירה = פתיחה + רווח נקי − דיבידנד."},

{l:2,t:"השפעת עסקאות",s:"מצגת",k:"עיוני",
 q:"הנפקת מניות תמורת מזומן:",
 o:["מגדילה את המזומן ואת הון המניות, ואינה הכנסה","היא הכנסה בדוח רווח והפסד","מגדילה את המזומן ואת ההתחייבויות","מקטינה את העודפים"],
 e:"הנפקה היא ⟦השקעת בעלים⟧, לא הכנסה מפעילות: מזומן ↑, הון מניות ↑."},

{l:2,t:"השפעת עסקאות",s:"סיכום",k:"עיוני",
 q:"עובדים עבדו בדצמבר, והשכר (20,000 ₪) ישולם בינואר. מה ההשפעה על הדוחות ליום 31.12?",
 o:["הוצאת שכר של 20,000 בדוח רווח והפסד, והתחייבות של 20,000 במאזן; המזומן לא משתנה",
    "אין השפעה עד התשלום בינואר",
    "המזומן קטן ב-20,000 בדצמבר",
    "נכס של 20,000 במאזן"],
 e:"⟦הקבלה⟧: ההוצאה שייכת לדצמבר. כיוון שעוד לא שולמה, מולה ⟦התחייבות⟧ (זכאים/עובדים). בינואר: מזומן ↓ והתחייבות ↓, בלי הוצאה נוספת."},

{l:2,t:"שינויים בהון",s:"מצגת",k:"חישוב",
 q:"עודפים ב-1.1.2016: 27,000 ₪. הרווח הנקי לשנה: 50,000 ₪. חולק דיבידנד של 1,000 ₪. מהי יתרת העודפים ב-31.12.2016?",
 o:["76,000","78,000","50,000","77,000"],
 e:"⟦עודפי סגירה = עודפי פתיחה + רווח נקי − דיבידנד⟧ = 27,000 + 50,000 − 1,000 = 76,000. זו היתרה שעוברת למאזן."},

{l:2,t:"שינויים בהון",s:"מצגת",k:"עיוני",
 q:"מה הקשר בין דוח רווח והפסד למאזן?",
 o:["הרווח הנקי עובר לעודפים בדוח על השינויים בהון, ומשם להון העצמי במאזן",
    "אין קשר בין הדוחות",
    "הרווח הנקי עובר ישירות למזומנים במאזן",
    "המאזן מחושב מתוך דוח התזרים בלבד"],
 e:"'המערכת הסגורה': ⟦רווח נקי ← עודפים ← הון עצמי⟧ במאזן; ומזומן בסוף דוח התזרים = יתרת המזומן במאזן."},

{l:2,t:"התהליך החשבונאי",s:"מצגת",k:"עיוני",
 q:"מהו הסדר הנכון של התהליך החשבונאי?",
 o:["עסקה ← פקודות יומן ← ספר ראשי ← מאזן בוחן ← דוחות כספיים",
    "פקודות יומן ← עסקה ← מאזן בוחן ← ספר ראשי ← דוחות כספיים",
    "דוחות כספיים ← מאזן בוחן ← ספר ראשי ← עסקה",
    "עסקה ← דוחות כספיים ← ספר ראשי ← פקודות יומן"],
 e:"1. ⟦עסקה⟧ כלכלית · 2. ⟦פקודת יומן⟧ — ניתוח ורישום · 3. ⟦ספר ראשי⟧ — ריכוז לפי חשבונות · 4. ⟦מאזן בוחן⟧ — סיכום היתרות ובדיקת איזון · 5. ⟦דוחות כספיים⟧."},

{l:2,t:"התהליך החשבונאי",s:"סיכום",k:"עיוני",
 q:"מתי אירוע הוא \"בר רישום\" בספרים?",
 o:["כשהוא משפיע על נכסים, התחייבויות, הכנסות או הוצאות","כשהוא קשור לבעלי המניות","כשהוא מופיע בפרוטוקול הדירקטוריון","כשהוא משפיע על מחיר המניה בבורסה"],
 e:"אירוע ⟦בר רישום⟧ אם השפיע על נכסים, התחייבויות, הכנסות או הוצאות. חתימה על הזמנה לעתיד, למשל, עוד לא משנה דבר."},

{l:2,t:"התהליך החשבונאי",s:"סיכום",k:"עיוני",
 q:"מאזן ליום 31.12.2026 מוצג עם \"מספרי השוואה\". לאיזה מועד הם מתייחסים?",
 o:["31.12.2025 — השנה הקודמת","31.12.2027","1.1.2026","לממוצע של השנה"],
 e:"⟦מספרי השוואה⟧ = הנתונים של התקופה הקודמת, בעמודה השמאלית, כדי לאפשר השוואה בין השנים."},

{l:2,t:"רווח והפסד",s:"סיכום",k:"חישוב",
 q:"נתונים: מכירות 1,000,000 · עלות המכר 800,000 · מכירה ושיווק 20,000 · הנהלה וכלליות 30,000 · הכנסות אחרות 40,000 · הוצאות אחרות 25,000 · הוצאות מימון 15,000 · הכנסות מימון 20,000 · מס 30,000. מהו הרווח התפעולי?",
 o:["165,000","200,000","170,000","140,000"],
 e:"רווח גולמי = 1,000,000 − 800,000 = 200,000. ⟦רווח תפעולי⟧ = 200,000 − 20,000 − 30,000 + 40,000 − 25,000 = 165,000. (המימון והמס באים אחרי הרווח התפעולי.)"},

{l:2,t:"רווח והפסד",s:"סיכום",k:"חישוב",
 q:"נתוני דוח רווח והפסד: מכירות 1,000,000 · עלות המכר 800,000 · מכירה ושיווק 20,000 · הנהלה וכלליות 30,000 · הכנסות אחרות 40,000 · הוצאות אחרות 25,000 · הוצאות מימון 15,000 · הכנסות מימון 20,000 · מס 30,000. מהו הרווח הנקי?",
 o:["140,000","165,000","170,000","110,000"],
 e:"רווח תפעולי 165,000 − מימון 15,000 + הכנסות מימון 20,000 = ⟦רווח לפני מס 170,000⟧ − מס 30,000 = ⟦140,000⟧."},

{l:2,t:"רווח והפסד",s:"סיכום",k:"עיוני",
 q:"חברה לממכר ריהוט מכרה את רכב המשלוחים הישן שלה ברווח. היכן יירשם הרווח?",
 o:["בהכנסות אחרות — רווח הון, לא חלק מהפעילות העיקרית","בהכנסות ממכירות","בהכנסות מימון","ישירות בהון העצמי"],
 e:"⟦הכנסות אחרות⟧ = הכנסות חד פעמיות שלא נובעות מהפעילות העיקרית, כמו רווח הון ממכירת רכוש קבוע. הכנסות ממכירות הן רק מליבת הפעילות (מכירת ריהוט)."},

{l:2,t:"רווח והפסד",s:"סיכום",k:"עיוני",
 q:"הוצאות פרסום ועמלות לסוכני מכירות יסווגו כ:",
 o:["הוצאות מכירה ושיווק","הוצאות הנהלה וכלליות","עלות המכר","הוצאות מימון"],
 e:"⟦מכירה ושיווק⟧: כל ההוצאות הקשורות לשיווק ולקידום — פרסום, עמלות לסוכנים, שכר ובונוסים לאנשי מכירות, רכב לאנשי מכירות, הובלה ללקוח."},

{l:2,t:"רווח והפסד",s:"סיכום",k:"עיוני",
 q:"שכר דירה של משרדי ההנהלה ופחת על ריהוט המשרד יסווגו כ:",
 o:["הוצאות הנהלה וכלליות","הוצאות מכירה ושיווק","הוצאות אחרות","הוצאות מימון"],
 e:"⟦הנהלה וכלליות⟧: ההוצאות לתפעול הכללי — שכר אנשי מטה, דמי שכירות, משרדיות, תקשורת, פחת, הוצאות משפטיות, הפרשה לחובות מסופקים."},

{l:2,t:"רווח והפסד",s:"סיכום",k:"עיוני",
 q:"ריבית על הלוואה מהבנק והפרשי שער יסווגו כ:",
 o:["הוצאות מימון","הוצאות הנהלה וכלליות","עלות המכר","הוצאות אחרות"],
 e:"⟦הוצאות מימון⟧: העלויות של מימון הפעילות — ריבית, הפרשי שער, עמלות, הפרשי הצמדה."},

{l:2,t:"רווח והפסד",s:"סיכום",k:"עיוני",
 q:"חברת תוכנה משכירה קומה פנויה בבניין שלה. איך יסווגו דמי השכירות שהיא מקבלת?",
 o:["הכנסות אחרות, כי זו לא הפעילות העיקרית שלה","הכנסות ממכירות","הכנסות מימון","הקטנה של הוצאות ההנהלה"],
 e:"דמי שכירות שאינם ⟦עיקר הפעילות⟧ נרשמים בהכנסות אחרות. בחברת נדל\"ן שזה עיסוקה, הם היו נרשמים בראש הדוח כהכנסות."},

{l:2,t:"רווח והפסד",s:"תרגיל",k:"חישוב",
 q:"למכירות של 1,000,000 ₪ התאים רווח גולמי של 300,000 ₪. מהו שיעור הרווח הגולמי?",
 o:["30%","70%","43%","300%"],

 e:"ב⟦FIFO⟧ היחידות שנשארות הן תמיד האחרונות שנקנו, בלי קשר למועד שבו נמכרו האחרות — ולכן תקופתי = תמידי. בממוצע (משוקלל לעומת נע) וב-LIFO התוצאה תלויה במועדי המכירות."},

{l:3,t:"שיטות הערכה",s:"תרגיל",k:"חישוב",
 q:"חברת נייר (אין מלאי פתיחה): 1.4 קנתה 250,000 יחידות ב-6 ₪ · 2.5 מכרה 200,000 · 7.7 קנתה 200,000 יחידות ב-5.5 ₪ · 9.10 מכרה 150,000. מהי עלות המכר לפי FIFO?",
 o:["2,050,000","2,022,222","2,100,000","1,925,000"],
 e:"נמכרו 350,000. לפי ⟦FIFO⟧: 250,000 × 6 + 100,000 × 5.5 = 1,500,000 + 550,000 = 2,050,000. מלאי הסגירה: 100,000 × 5.5 = 550,000."},

{l:3,t:"שיטות הערכה",s:"תרגיל",k:"חישוב",
 q:"חברת נייר (אין מלאי פתיחה): נקנו 250,000 יחידות ב-6 ₪ ו-200,000 ב-5.5 ₪, ונמכרו 350,000 יחידות. מהי עלות המכר לפי ממוצע משוקלל (מלאי תקופתי)?",
 o:["2,022,222","2,050,000","2,040,000","1,925,000"],
 e:"מחיר ממוצע = (1,500,000 + 1,100,000) ÷ 450,000 = 5.778. עלות המכר = 350,000 × 5.778 = ⟦2,022,222⟧. מלאי הסגירה: 100,000 × 5.778 = 577,778."},

{l:3,t:"שיטות הערכה",s:"תרגיל",k:"חישוב",
 q:"חברת נייר, מלאי תמידי עם ממוצע נע: 1.4 קנתה 250,000 יחידות ב-6 ₪ · 2.5 מכרה 200,000 · 7.7 קנתה 200,000 ב-5.5 ₪ · 9.10 מכרה 150,000. מהי עלות המכר?",
 o:["2,040,000","2,022,222","2,050,000","2,000,000"],
 e:"⟦ממוצע נע⟧ — מחשבים ממוצע חדש אחרי כל קנייה. 2.5: 200,000 × 6 = 1,200,000; נשארו 50,000 × 6 = 300,000. 7.7: + 1,100,000 ⇐ 250,000 יחידות ב-1,400,000 = 5.6 ליחידה. 9.10: 150,000 × 5.6 = 840,000. סה\"כ 2,040,000."},

{l:3,t:"שיטות הערכה",s:"תרגיל",k:"חישוב",
 q:"חברת נייר: נמכרו 350,000 יחידות ב-10 ₪, ועלות המכר לפי FIFO היא 2,050,000. מהו הרווח הגולמי לפי FIFO?",
 o:["1,450,000","1,477,778","3,500,000","550,000"],
 e:"מכירות 350,000 × 10 = 3,500,000 − עלות המכר 2,050,000 = ⟦1,450,000⟧. (בממוצע משוקלל: 3,500,000 − 2,022,222 = 1,477,778.)"},

{l:3,t:"שיטות הערכה",s:"רשימה",k:"עיוני",
 q:"בתקופה של ירידת מחירים מתמשכת, מה מאפיין את שיטת FIFO לעומת ממוצע משוקלל?",
 o:["עלות מכר גבוהה יותר ומלאי סגירה נמוך יותר","עלות מכר נמוכה יותר ומלאי סגירה גבוה יותר","רווח גולמי גבוה יותר","אין הבדל בין השיטות"],
 e:"ב-FIFO נמכרות ⟦היחידות הישנות⟧ ונשארות האחרונות. כשהמחירים יורדים, הישנות יקרות: עלות המכר גבוהה, מלאי הסגירה (היחידות החדשות והזולות) נמוך, והרווח נמוך. כשהמחירים עולים — הפוך."},

{l:3,t:"שיטות הערכה",s:"מצגת",k:"עיוני",
 q:"בתקופה של עליית מחירים, איזו שיטה תציג את הרווח הגולמי הגבוה ביותר?",
 o:["FIFO","ממוצע משוקלל","LIFO","כל השיטות יציגו את אותו רווח"],
 e:"כשהמחירים עולים, FIFO 'מוכר' את היחידות ⟦הישנות והזולות⟧: עלות מכר נמוכה ⇐ רווח גבוה, ומלאי סגירה גבוה (במחירים העדכניים). הממוצע באמצע; LIFO הפוך (ואסורה לפי IFRS)."},

{l:3,t:"שיטות הערכה",s:"מצגת",k:"עיוני",
 q:"לחברת «המברג המופלא» מלאי של ברגים, והעלות ליחידה (בורג) ירדה בהדרגה בשנים 2008–2009. מלאי הפתיחה בשתי שיטות: 600,000 ברגים ב-1,235,900 ₪. מלאי הסגירה (600,000 ברגים): שיטה א' — 745,821; שיטה ב' — 875,678. מהי שיטה א'?",
 o:["FIFO","ממוצע משוקלל","זיהוי ספציפי","אי אפשר לדעת"],
 e:"כשהמחירים ⟦יורדים⟧, מלאי הסגירה לפי FIFO מורכב מהקניות האחרונות והזולות ⇐ ⟦נמוך⟧ יותר. לכן שיטה א' (745,821, הנמוכה) היא FIFO, ושיטה ב' — ממוצע משוקלל, שכולל גם יחידות ישנות ויקרות."},

{l:3,t:"שיטות הערכה",s:"סיכום",k:"עיוני",
 q:"האם מותר להשתמש בשיטת LIFO לפי IFRS?",
 o:["לא — היא אסורה","כן, בכל חברה","כן, רק בחברות תעשייתיות","כן, רק בתקופת אינפלציה"],
 e:"⟦LIFO אסורה⟧ לפי התקינה הבינלאומית (ובקובץ התרגילים: 'אסור בישראל'). השיטות המותרות: זיהוי ספציפי, FIFO וממוצע."},

{l:3,t:"שיטות הערכה",s:"סיכום",k:"עיוני",
 q:"מה המשמעות של עקביות בשיטת הערכת המלאי?",
 o:["החברה בוחרת שיטה אחת ומיישמת אותה בכל שנה; שינוי שיטה מחייב לתקן את הדוחות של השנים הקודמות",
    "החברה יכולה לבחור כל שנה את השיטה שמציגה את הרווח הגבוה ביותר",
    "כל החברות מעריכות מלאי באותה שיטה",
    "רשות המסים קובעת את השיטה"],
 e:"לפי ⟦העקביות⟧ והמדיניות החשבונאית, החברה נשארת עם השיטה שבחרה. אם תשנה אותה, עליה לתקן את הדוחות של שנים קודמות (בדרך כלל במספרי ההשוואה)."},

{l:3,t:"שיטות הערכה",s:"תרגיל",k:"חישוב",
 q:"מלאי פתיחה: 4,000 ק\"ג מלט ב-20 ₪. נקנו 2,000 ק\"ג ב-40; נמכרו 1,000; נקנו 5,000 ק\"ג ב-60; נמכרו 2,000. מהו מלאי הסגירה לפי FIFO?",
 o:["400,000","280,000","334,545","346,667"],
 e:"נשארו 8,000 ק\"ג — לפי ⟦FIFO⟧ מהקניות האחרונות: 5,000 × 60 + 2,000 × 40 + 1,000 × 20 = 300,000 + 80,000 + 20,000 = 400,000. (ממוצע משוקלל: 334,545; ממוצע נע: 346,667; LIFO תקופתי: 280,000.)"},

{l:3,t:"שיטות הערכה",s:"תרגיל",k:"חישוב",
 q:"מלאי פתיחה: 4,000 ק\"ג מלט ב-20 ₪. נקנו 2,000 ק\"ג ב-40 ו-5,000 ק\"ג ב-60, ובסוף השנה נשארו 8,000 ק\"ג. מהו מלאי הסגירה לפי ממוצע משוקלל (מלאי תקופתי)?",
 o:["334,545","400,000","346,667","280,000"],
 e:"מחיר ממוצע = (80,000 + 80,000 + 300,000) ÷ 11,000 = 41.82 ⇐ 8,000 × 41.82 = ⟦334,545⟧."},

{l:3,t:"שיטות הערכה",s:"תרגיל",k:"חישוב",
 q:"חברת צעצועים (אין מלאי פתיחה) קנתה: 100,000 יחידות ב-5 ₪ · 70,000 ב-5.5 · 80,000 ב-6 · 90,000 ב-6.5 · 50,000 ב-7. בסך הכול נמכרו 260,000 יחידות. מהו מלאי הסגירה לפי FIFO?",
 o:["870,000","766,667","650,000","910,000"],
 e:"נשארו 390,000 − 260,000 = 130,000 יחידות — ⟦מהקניות האחרונות⟧: 50,000 × 7 + 80,000 × 6.5 = 350,000 + 520,000 = 870,000. עלות המכר: 2,300,000 − 870,000 = 1,430,000."},

{l:3,t:"שיטות הערכה",s:"תרגיל",k:"חישוב",
 q:"סקטים, 2014 (אין מלאי פתיחה): נקנו 7,000 ב-40 · 12,000 ב-45 · 17,000 ב-54 · 9,000 ב-62 (סה\"כ 45,000 יחידות ב-2,296,000). בסוף השנה נשארו 15,100. מהו מלאי הסגירה לפי FIFO?",
 o:["887,400","770,436","604,000","936,200"],
 e:"לפי ⟦FIFO⟧ נשארו האחרונות: 9,000 × 62 + 6,100 × 54 = 558,000 + 329,400 = 887,400. עלות המכר: 2,296,000 − 887,400 = 1,408,600. (בממוצע משוקלל: 51.02 × 15,100 = 770,436.)"},

{l:3,t:"שווי מימוש נטו",s:"סיכום",k:"עיוני",
 q:"כיצד יוצג המלאי במאזן לפי IAS 2?",
 o:["לפי הנמוך מבין העלות ושווי המימוש נטו","לפי הגבוה מבין העלות ושווי המימוש נטו","תמיד לפי עלות","תמיד לפי מחיר המכירה"],
 e:"⟦עלות או שווי מימוש נטו — הנמוך מביניהם⟧. זה יישום של השמרנות: הפסד צפוי מוכר מיד, ורווח צפוי — רק במכירה."},

{l:3,t:"שווי מימוש נטו",s:"מצגת",k:"עיוני",
 q:"מהו שווי המימוש נטו של מלאי?",
 o:["מחיר המכירה הצפוי במהלך העסקים הרגיל, בניכוי העלויות הצפויות להשלמה ולמכירה",
    "מחיר הקנייה בתוספת הובלה",
    "מחיר המכירה בלבד",
    "מה שהיה עולה לקנות את המלאי היום"],
 e:"מדוח רמי לוי שבמצגת: 'ערך המימוש נטו הוא ⟦אומדן מחיר המכירה⟧ במהלך העסקים הרגיל, ⟦בניכוי⟧ אומדן העלות להשלמה ואומדן העלויות הדרושות לביצוע המכירה'."},

{l:3,t:"שווי מימוש נטו",s:"סיכום",k:"חישוב",
 q:"עלות המלאי ב-31.12: 100,000 ₪. שווי המימוש נטו: 85,000 ₪. כיצד יוצג?",
 o:["85,000, ויירשם הפסד מירידת ערך של 15,000","100,000, בלי הפסד","85,000, וההפרש יירשם ישירות בהון","100,000, עם ביאור על ירידת הערך"],
 e:"שווי המימוש ⟦נמוך⟧ מהעלות ⇐ המלאי מוצג ב-85,000, וההפרש (15,000) הוא הפסד מירידת ערך מלאי בדוח רווח והפסד (מקטין את הרווח הגולמי)."},

{l:3,t:"שווי מימוש נטו",s:"סיכום",k:"חישוב",
 q:"עלות המלאי 100,000 ₪, שווי המימוש נטו 180,000 ₪. כיצד יוצג?",
 o:["100,000 — לפי העלות, הנמוך מהשניים","180,000, ויירשם רווח של 80,000","180,000, וההפרש יירשם בהון","140,000 — הממוצע"],
 e:"שווי המימוש ⟦גבוה⟧ מהעלות ⇐ המלאי נשאר בעלות. רווח נרשם רק כשהמלאי ימומש (יימכר)."},

{l:3,t:"שווי מימוש נטו",s:"סיכום",k:"חישוב",
 q:"במלאי 1,000 יחידות בעלות 110 ₪ ליחידה. מחיר המכירה הצפוי 120 ₪, ועלויות המכירה הצפויות 15 ₪ ליחידה. מהו ההפסד מירידת ערך?",
 o:["5,000","0","10,000","15,000"],
 e:"שווי מימוש נטו = 120 − 15 = 105 < עלות 110 ⇐ ירידת ערך של 5 ליחידה × 1,000 = ⟦5,000⟧. מי שמשווה רק למחיר המכירה (120 > 110) יחשוב בטעות שאין ירידת ערך."},

{l:3,t:"שווי מימוש נטו",s:"תרגיל",k:"חישוב",
 q:"במלאי 140 טון, שעלותם לפי FIFO 100,000 ₪, והרווח הגולמי לשנה לפי FIFO 80,000 ₪. בתחילת השנה הבאה, בעקבות מחקר משמיץ, צנח מחיר המכירה והתייצב על 200 ₪ לטון (ירידה לא זמנית). מה יהיה הרווח הגולמי לשנה הנוכחית?",
 o:["8,000 — המלאי יוצג ב-28,000, וההפסד של 72,000 נרשם כבר השנה",
    "80,000 — ההפסד יירשם בשנה הבאה, כשהמלאי יימכר",
    "72,000",
    "28,000"],
 e:"שווי מימוש נטו = 140 × 200 = 28,000 < עלות 100,000. לפי ⟦השמרנות⟧ ההפסד הצפוי (72,000) מוכר כבר השנה: 80,000 − 72,000 = 8,000."},

{l:3,t:"שווי מימוש נטו",s:"סיכום",k:"עיוני",
 q:"מחיר חומרי הגלם במלאי ירד, אבל המוצר הגמור שמיוצר מהם צפוי להימכר ברווח. האם יש להפחית את ערכם?",
 o:["לא — כל עוד המוצר הגמור יימכר בעלותו או יותר","כן, תמיד כשמחיר חומרי הגלם יורד","כן, לפי מחיר המכירה של חומרי הגלם","רק בחברה מסחרית"],
 e:"לפי סעיף 32 בתקן: ⟦אין רושמים ירידת ערך⟧ לחומרי גלם המוחזקים לייצור, אם המוצר המוגמר צפוי להימכר בעלות או יותר. רק אם הירידה מעידה על ירידה במחיר המוצר הגמור — מפחיתים."},

{l:3,t:"שווי מימוש נטו",s:"מצגת",k:"עיוני",
 q:"איזה מהבאים אינו סיבה לירידת ערך של מלאי?",
 o:["עלייה במחירי המכירה בשוק","פגמים ונזקים","התיישנות","שינוי בטעמי הצרכנים"],
 e:"במצגת, הסיבות לירידת ערך מלאי: ⟦פגמים, נזקים, התיישנות, שינויי טעמים, מחירי מכירה יורדים⟧. עלייה במחירים רק מגדילה את שווי המימוש."},

{l:3,t:"שווי מימוש נטו",s:"מצגת",k:"עיוני",
 q:"באילו ענפים המלאי מוערך לפי שווי שוק, כחריגה מכלל העלות?",
 o:["חקלאות, עצים, יהלומים ומשאבי טבע","קמעונאות ומזון","חברות תוכנה","חברות תעשייתיות באופן כללי"],
 e:"במצגת: ⟦חריגה מכללי עלות ייצור⟧ — עצים, יהלומים, חקלאות (ובדף העזר הקיים גם משאבי טבע, פירות וירקות). בהם המלאי לפי שווי שוק."},

{l:3,t:"שיטות מיוחדות",s:"תרגיל",k:"חישוב",
 q:"רשת סופרים: מכירות השנה 6 מיליון ₪, קניות 5 מיליון, מלאי פתיחה 1 מיליון. שיעור הרווח הגולמי ברשת 20%. מהו מלאי הסגירה המשוער?",
 o:["1.2 מיליון","1 מיליון","2 מיליון","0.8 מיליון"],
 e:"עלות המכר = 6 × (1 − 20%) = 4.8 מיליון. ⟦י.ס = י.פ + קניות − עלות המכר⟧ = 1 + 5 − 4.8 = 1.2 מיליון."},

{l:3,t:"שיטות מיוחדות",s:"תרגיל",k:"חישוב",
 q:"חנות לחומרי בניין נשרפה ב-26.3, ולא נותר דבר מהמלאי. מ-1.1 ועד השרפה: מכירות 21,935 ₪, קניות 19,000 ₪. מלאי ב-1.1: 13,000 ₪. שיעור הרווח הגולמי בשנתיים הקודמות: 20% ו-25% (ממוצע 22.5%). לפי כמה תשפה חברת הביטוח על המלאי שנשרף?",
 o:["15,000","13,000","32,000","17,000"],
 e:"עלות המכר המשוערת = 21,935 × (1 − 22.5%) ≈ 17,000. ⟦י.ס = 13,000 + 19,000 − 17,000 = 15,000⟧ — זה המלאי שנשרף."},

{l:3,t:"חברה תעשייתית",s:"תרגיל",k:"חישוב",
 q:"חברה יצרנית בשנתה הראשונה: קניות חומרי גלם 18,000 · חרושת 30,000 · עבודה 50,000 · פחת 10,000. בסוף השנה: מלאי חומרי גלם 3,000, תוצרת בעיבוד 15,000. יוצרו 450 יחידות, ונמכרו 300 במחיר 300 ₪. מהו הרווח הגולמי?",
 o:["30,000","20,000","15,000","0"],
 e:"חו\"ג שנצרכו = 18,000 − 3,000 = 15,000. עלויות ייצור = 15,000 + 30,000 + 50,000 + 10,000 = 105,000. עלות מה שהושלם = 105,000 − 15,000 (בעיבוד) = 90,000 ⇐ 200 ליחידה. עלות המכר = 300 × 200 = 60,000. מכירות 90,000 ⇐ ⟦רווח גולמי 30,000⟧. (מי ששוכח את התוצרת בעיבוד מקבל 20,000.)"},

{l:3,t:"חברה תעשייתית",s:"תרגיל",k:"חישוב",
 q:"במפעל: מלאי חומרי גלם ב-1.1: 800 · קניות חומרי גלם: 3,300 · מלאי חומרי גלם ב-31.12: 1,200 (באלפי ₪). מה עלות חומרי הגלם שנצרכו בייצור?",
 o:["2,900","3,300","3,700","4,100"],
 e:"⟦חו\"ג שנצרכו = י.פ חו\"ג + קניות − י.ס חו\"ג⟧ = 800 + 3,300 − 1,200 = 2,900."},

  var expl=function(q){return ltrMath(esc0(q.e)).replace(/⟦([^⟧]*)⟧/g,"<b>$1</b>");};
  var sub={"end":"מפתח התשובות וההסברים בסוף","in":"עם תשובות והסברים","none":"ללא תשובות"}[mode];
  var ls={};arr.forEach(function(q){ls[q.l]=1;});ls=Object.keys(ls);

         '<div class="po pe">'+expl(q)+"</div>";

/* דגימה שווה בין הפרקים: לוקחים לסירוגין מכל פרק בתורו, בסדר אקראי. */
function balancedPick(arr,n){
  var by={},order=[];
  arr.forEach(function(q){ if(!by[q.l]){by[q.l]=[];order.push(q.l);} by[q.l].push(q); });
  shuffle(order);
  var out=[],i=0;
  while(out.length<n){
    var added=false;
    for(var k=0;k<order.length&&out.length<n;k++){
      var pool=by[order[k]];
      if(i<pool.length){ out.push(pool[i]); added=true; }
    }
    if(!added)break;
    i++;
  }
  return out;
}

/* מקלדת, במסך של שאלה: חץ שמאלה = הבאה, חץ ימינה = הקודמת (האתר מימין לשמאל), 1-4 = בחירת תשובה */
document.addEventListener("keydown",function(ev){
  var cf=document.getElementById("cfm");
  if(cf){if(ev.key==="Escape")cf.parentNode.removeChild(cf);return;}
  if(!app.querySelector(".qtext")||ev.ctrlKey||ev.metaKey||ev.altKey)return;
  var bs=app.querySelectorAll(".nav .btn");
  if(ev.key==="ArrowLeft"&&bs[1]&&!bs[1].disabled){ev.preventDefault();bs[1].click();}
  else if(ev.key==="ArrowRight"&&bs[0]&&!bs[0].disabled){ev.preventDefault();bs[0].click();}
  else if(/^[1-4]$/.test(ev.key)){
    var o=app.querySelectorAll(".opt")[+ev.key-1];
    if(o&&o.className.indexOf("locked")<0){ev.preventDefault();o.click();}
  }
});

    var el=document.getElementById("clock");
    if(el)el.textContent=fmt(timeLeft);
    if(timeLeft<=0){stopTimer();examSubmit(true);}
  },1000);
}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function eRender(){
  var q=quiz[idx];
  app.innerHTML="";
  var c=E("div",{"class":"card"});
  c.appendChild(topBar(ctx==="ready"?'מבחן מוכנות · זמן: <span class="clock" id="clock">'+fmt(elapsed)+'</span>':
    sel.minutes?'זמן שנותר: <span class="clock" id="clock">'+fmt(timeLeft)+'</span>':""));
  var nAns=0;for(var i=0;i<ansMap.length;i++)if(ansMap[i]!=null)nAns++;
  var st=E("div",{"class":"stats"});
  st.innerHTML="<span>שאלה <b>"+(idx+1)+"</b> / <b>"+quiz.length+"</b></span><span>נענו: <b>"+nAns+"</b></span>";
  c.appendChild(st);
  c.appendChild(bar(nAns/quiz.length));
  if(ctx!=="ready")c.appendChild(metaRow(q));
  c.appendChild(E("div",{"class":"qtext"},rich(q.q)));

  var box=E("div");
  q.o.forEach(function(txt,i){
    var b=E("button",{"class":"opt"+(ansMap[idx]===i?" picked":"")});
    b.innerHTML='<span class="ltr">'+LET[i]+'</span><span>'+rich(txt)+'</span>';
    b.onclick=function(){ansMap[idx]=i;eRender();};
    box.appendChild(b);
  });
  c.appendChild(box);

  var nav=E("div",{"class":"nav"});
  var prev=E("button",{"class":"btn"},"→ הקודמת");
  prev.disabled=idx===0;prev.onclick=function(){idx--;eRender();};
  var next=E("button",{"class":"btn btn-pri"},"הבאה ←");
  next.disabled=idx===quiz.length-1;next.onclick=function(){idx++;eRender();};
  nav.appendChild(prev);nav.appendChild(next);
  c.appendChild(nav);

  c.appendChild(E("div",{"class":"ptitle",style:"margin-top:16px"},"מפת שאלות — לחצו כדי לעבור לשאלה · מסומנות: שאלות שנענו"));
  var pal=E("div",{"class":"palette"});
  quiz.forEach(function(_,i){
    var b=E("button",{"class":"pbtn"+(ansMap[i]!=null?" ans":"")+(i===idx?" cur":"")},String(i+1));
    b.onclick=function(){idx=i;eRender();};
    pal.appendChild(b);
  });
  c.appendChild(pal);

  var sub=E("button",{"class":"btn btn-pri"},"הגשת המבחן");
  sub.style.width="100%";sub.style.marginTop="14px";
  sub.onclick=function(){
    var un=quiz.length-nAns;
    if(un>0)askConfirm("נותרו "+un+" שאלות ללא מענה. להגיש בכל זאת?","הגשה",function(){examSubmit(false);});
    else examSubmit(false);
  };
  c.appendChild(sub);
  app.appendChild(c);
  window.scrollTo(0,0);
}
function examSubmit(auto){
  stopTimer();
  var sc=0,wr=[];
  quiz.forEach(function(q,i){ if(ansMap[i]===q.c)sc++; else wr.push({q:q,given:ansMap[i]}); });
  if(ctx==="ready")readySave(sc,quiz.length);
  results(sc,quiz.length,wr.map(function(x){return x.q;}),ctx==="ready"?readyStart:examStart,null,wr,auto);
}

/* ---------- results ---------- */
function results(sc,total,wr,onAgain,onRetryWrong,detail,auto){
  stopTimer();
  app.innerHTML="";
  var pct=total?Math.round(sc/total*100):0;
  var c=E("div",{"class":"card result"});
  if(auto)c.appendChild(E("div",{"class":"note"},"<b>הזמן נגמר</b> — המבחן הוגש אוטומטית."));
  if(ctx==="ready")c.appendChild(E("div",{"class":"note"},"<b>מבחן מוכנות</b> · "+Math.max(1,Math.round(elapsed/60))+
    " דקות · השאלות האלה לא מופיעות בתרגול, ולכן הציון מעריך שליטה בחומר."));
  c.appendChild(E("div",{"class":"big"},pct));
  var g = pct>=90?"מצוין — שליטה מלאה בחומר":
          pct>=80?"טוב מאוד":
          pct>=70?"טוב — כדאי לחזור על הנושאים החלשים":
          pct>=60?"עובר — מומלץ לחזור ולתרגל":
                  "מתחת לציון עובר — כדאי לחזור על החומר ולתרגל שוב";
  c.appendChild(E("div",{"class":"grade"},sc+" מתוך "+total+" · "+g));

  var nav=E("div",{"class":"nav"});
  var again=E("button",{"class":"btn btn-pri"},"סבב חדש");
  again.onclick=onAgain;nav.appendChild(again);
  if(onRetryWrong&&wr.length){
    var rw=E("button",{"class":"btn"},"תרגול "+wr.length+" השגויות");
    rw.onclick=onRetryWrong;nav.appendChild(rw);
  }
  var home=E("button",{"class":"btn"},"הגדרות");
  home.onclick=setup;nav.appendChild(home);
  c.appendChild(nav);
  app.appendChild(c);

  if(detail)app.appendChild(breakdown(quiz,wr));
  if(detail&&detail.length){
    var d=E("div",{"class":"card"});
    d.appendChild(E("div",{"class":"ptitle"},"סקירת "+detail.length+" השאלות שנענו לא נכון"));
    detail.forEach(function(x){
      var r=E("div",{"class":"rev"});
      var given = x.given==null?"<i>לא נענתה</i>":LET[x.given]+". "+rich(x.q.o[x.given]);
      r.innerHTML='<div style="font-size:11.5px;color:var(--muted)">פרק '+x.q.l+' · '+x.q.t+'</div>'+
        '<div class="rq">'+rich(x.q.q)+'</div>'+
        '<div class="ra">התשובה שלך: '+given+'</div>'+
        '<div class="rc">התשובה הנכונה: '+LET[x.q.c]+". "+rich(x.q.o[x.q.c])+'</div>'+
        '<div style="margin-top:6px;color:var(--muted)">'+rich(x.q.e)+'</div>';
      d.appendChild(r);
    });
    app.appendChild(d);
  } else if(wr.length){
    var d2=E("div",{"class":"card"});
    d2.appendChild(E("div",{"class":"ptitle"},"נושאים לחזרה"));
    var byTopic={},order=[];
    wr.forEach(function(q){var k="פרק "+q.l+" · "+q.t;if(!byTopic[k]){byTopic[k]=0;order.push(k);}byTopic[k]++;});
    var ul=E("div",{"class":"toolbar"});
    order.forEach(function(t){
      ul.appendChild(E("span",{"class":"pill"},t+" — "+byTopic[t]+(byTopic[t]===1?" שגיאה":" שגיאות")));
    });
    d2.appendChild(ul);
    app.appendChild(d2);
  }
  window.scrollTo(0,0);
}

/* פילוח לפי פרק בסוף מבחן: כמה נענו נכון מכל פרק, ועל מה לחזור קודם */
function breakdown(all,wrongQs){
  var by={},order=[],bad={};
  all.forEach(function(q){if(!by[q.l]){by[q.l]=0;order.push(q.l);}by[q.l]++;});
  wrongQs.forEach(function(q){bad[q.l]=(bad[q.l]||0)+1;});
  order.sort(function(a,b){return a-b;});
  var d=E("div",{"class":"card"});
  d.appendChild(E("div",{"class":"ptitle"},"פילוח לפי פרק"));
  var weak=[];
  order.forEach(function(l){
    var n=by[l],ok=n-(bad[l]||0),f=ok/n;
    if(f<0.75)weak.push({l:l,f:f});
    var row=E("div",{"class":"brk"+(f<0.5?" low":f<1?" mid":"")});
    row.innerHTML='<span class="bl">פרק '+l+' · '+(LNAME[l]||"")+'</span>'+
      '<span class="bb"><i style="width:'+Math.round(f*100)+'%"></i></span><span class="bv">'+ok+'/'+n+'</span>';
    d.appendChild(row);
  });
  if(weak.length){
    weak.sort(function(a,b){return a.f-b.f||a.l-b.l;});
    var ls=weak.map(function(w){return w.l;});
    d.appendChild(E("div",{"class":"scopehint",style:"margin:12px 0 10px"},
      "כדאי לחזור קודם על: "+ls.map(function(l){return "פרק "+l+" ("+(LNAME[l]||"")+")";}).join(", ")+"."));
    var go=E("button",{"class":"btn"},"תרגול הפרקים האלה");
    go.onclick=function(){sel.lects=ls.slice();sel.topics=TOPICS.slice();sel.src="all";sel.kind="all";sel.mode="practice";ctx="";setup();};
    d.appendChild(go);
  } else d.appendChild(E("div",{"class":"scopehint",style:"margin-top:12px"},"בלי שגיאות. כל הפרקים עברו."));
  return d;
}

setup();
})();
</script>
